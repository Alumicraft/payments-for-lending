[project]
name = "dcr"
authors = [
    { name = "DCR", email = "hello@example.com" }
]
description = "Dealer Capital Resources — Home Builder Lending Platform"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "dcr"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
erpnext = ">=15.0.0,<17.0.0"
lending = ">=15.0.0,<17.0.0"
